  <!-- 斜向代码雨动画 -->
  <script>
    (function(){
      var canvas = document.getElementById('rain-canvas');
      if (!canvas) return;
      var ctx = canvas.getContext('2d', { alpha: true });

      var charArr = ['0','1'];

      var drops = [];
      var speeds = [];
      var columns = 0;
      var colWidth = 26;
      var fontSize = 18;
      var lastTime = 0;
      var FPS = 22;
      var frameInterval = 1000 / FPS;
      var W = 0;
      var H = 0;

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        columns = Math.floor(W / colWidth) + 2;
        drops = new Array(columns);
        speeds = new Array(columns);
        for (var i = 0; i < columns; i++) {
          drops[i] = Math.random() * -(H / fontSize);
          speeds[i] = 0.35 + Math.random() * 0.65;
        }
      }

      function draw(timestamp) {
        requestAnimationFrame(draw);
        if (timestamp - lastTime < frameInterval) return;
        lastTime = timestamp;

        ctx.fillStyle = 'rgba(10,25,47,0.04)';
        ctx.fillRect(0, 0, W, H);

        ctx.font = fontSize + 'px "SF Mono","Fira Code","Consolas",monospace';

        for (var i = 0; i < columns; i++) {
          var x = i * colWidth;
          var y = drops[i] * fontSize;

          if (y < -fontSize || y > H + fontSize) {
            drops[i] += speeds[i];
            if (y > H + fontSize * 3 && Math.random() > 0.97) {
              drops[i] = Math.random() * -6;
              speeds[i] = 0.35 + Math.random() * 0.65;
            }
            continue;
          }

          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.fillText(charArr[Math.floor(Math.random() * 2)], x, y);

          if (y > fontSize) {
            ctx.fillStyle = 'rgba(255,255,255,0.32)';
            ctx.fillText(charArr[Math.floor(Math.random() * 2)], x, y - fontSize);
          }

          drops[i] += speeds[i];

          if (y > H + fontSize * 3 && Math.random() > 0.97) {
            drops[i] = Math.random() * -6;
            speeds[i] = 0.35 + Math.random() * 0.65;
          }
        }
      }

      resize();
      window.addEventListener('resize', function () {
        clearTimeout(window._rainRt);
        window._rainRt = setTimeout(resize, 250);
      });
      requestAnimationFrame(draw);
    })();
  </script>

  <!-- 加载更新日志 -->
  <script>
    (function(){
      var panel = document.getElementById('changelog-panel');
      fetch('CHANGELOG.md')
        .then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status); return res.text(); })
        .then(function(md){
          var html = '';
          var lines = md.split('\n');
          var i = 0;
          while(i < lines.length){
            var line = lines[i];
            if(line.indexOf('## ') === 0){
              html += '<h2>' + esc(line.slice(3)) + '</h2>';
            } else if(line.indexOf('# ') === 0){
              html += '<h2>' + esc(line.slice(2)) + '</h2>';
            } else if(line.trim() !== ''){
              html += '<p>' + esc(line) + '</p>';
            }
            i++;
          }
          panel.innerHTML = html || '<p class="changelog-loading">暂无更新日志</p>';
        })
        .catch(function(){
          panel.innerHTML = '<p class="changelog-loading">更新日志加载失败</p>';
        });
      function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    })();
  </script>

<script>
(function() {
  // ===== 清除存档 =====
  var clearBtn = document.getElementById('clear-save-btn');
  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      // 检查是否有存档
      var hasSave = localStorage.getItem('oi_coach_save') !== null || sessionStorage.getItem('oi_coach_save') !== null;
      
      if (!hasSave) {
        alert('📭 没有找到存档');
        return;
      }
      
      if (confirm('⚠️ 确定要清除所有存档吗？\n\n此操作将删除：\n• localStorage 中的游戏存档\n• sessionStorage 中的游戏存档\n• 游戏进度数据\n\n此操作不可恢复！')) {
        try {
          localStorage.removeItem('oi_coach_save');
          sessionStorage.removeItem('oi_coach_save');
          localStorage.removeItem('oi_coach_ending_reason');
          sessionStorage.removeItem('oi_coach_ending_reason');
          localStorage.removeItem('oi_game_active_session');
          sessionStorage.removeItem('oi_game_active_session');
          alert('✅ 所有存档已清除');
          // 刷新页面
          window.location.reload();
        } catch(e) {
          alert('❌ 清除失败：' + e.message);
        }
      }
    });
  }

  // ===== 成就系统 =====
  var achievementBtn = document.getElementById('achievement-btn');
  if (achievementBtn) {
    achievementBtn.addEventListener('click', function() {
      showAchievementModal();
    });
  }

  // 成就定义（与 achievement-system.js 保持一致）

    'first_student': { id: 'first_student', name: '🎓 开门弟子', description: '招收第一名学生', icon: '🎓' },
    'class_full': { id: 'class_full', name: '🏫 满员班级', description: '同时拥有 10 名学生', icon: '🏫' },

    'noi_champion': { id: 'noi_champion', name: '👑 NOI 冠军', description: '在 NOI 中获得金牌', icon: '👑' },
    'grand_slam': { id: 'grand_slam', name: '🏆 大满贯', description: '全部比赛获得金牌', icon: '🏆' },
    'level_10': { id: 'level_10', name: '📈 资深教练', description: '教练等级达到 10 级', icon: '📈' },
    'level_30': { id: 'level_30', name: '🌟 传奇教练', description: '教练等级达到 30 级', icon: '🌟' },
    'max_level': { id: 'max_level', name: '👑 巅峰教练', description: '教练等级达到 50 级', icon: '👑' },
    'skill_master': { id: 'skill_master', name: '🧠 技能大师', description: '任意技能达到满级', icon: '🧠' },
    'rich': { id: 'rich', name: '💰 富甲一方', description: '经费达到 100000', icon: '💰' },

    'team_work': { id: 'team_work', name: '🤝 团队之星', description: '创建队伍并获胜 5 场', icon: '🤝' }
  };

  // 从存档读取已解锁成就
  function getUnlockedAchievements() {
    try {
      var raw = localStorage.getItem('oi_coach_save');
      if (raw) {
        var data = JSON.parse(raw);
        if (data.achievements && typeof data.achievements.unlocked !== 'undefined') {
          return data.achievements.unlocked || new Set();
        }
      }
    } catch(e) {}
    return new Set();
  }

  function showAchievementModal() {
    var unlocked = getUnlockedAchievements();
    var total = Object.keys(ACHIEVEMENTS).length;
    var unlockedCount = unlocked.size || 0;

          <div class="achievement-list">
    `;
    
    for (var id in ACHIEVEMENTS) {
      var ach = ACHIEVEMENTS[id];
      var isUnlocked = unlocked.has(id);

      `;
    }
    
    html += `
          </div>
        </div>
      </div>
    `;
    
    // 添加到页面
    var container = document.createElement('div');
    container.innerHTML = html;
    document.body.appendChild(container.firstElementChild);
    
    // 关闭事件
    var overlay = document.getElementById('achievement-modal-overlay');
    var closeBtn = document.getElementById('achievement-close-btn');
    
    function closeModal() {
      if (overlay) overlay.remove();
    }
    
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    if (overlay) {
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeModal();
      });
      // ESC 键关闭
      overlay.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
      });
      overlay.focus();
    }
  }

})();
</script>
