<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minemob百科</title>
    <!-- marked.js 让 Markdown 生效 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #f5f7fc;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: #1e1e2a;
            padding: 30px 20px 60px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        /* 返回链接 */
        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: #8a8aaa;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .back-link:hover {
            color: #3d3363;
        }

        /* 主卡片 */
        .profile-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 36px 36px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03), 0 1px 6px rgba(0,0,0,0.02);
            border: 1px solid rgba(60, 60, 100, 0.05);
        }

        /* 头部 */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f2f8;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #eef0f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            flex-shrink: 0;
            border: 1px solid #d6dae6;
        }

        .name-title h1 {
            font-size: 26px;
            font-weight: 600;
            color: #1e1e2a;
        }

        .name-title .sub {
            font-size: 14px;
            color: #8a8aaa;
            margin-top: 2px;
        }

        /* 板块 */
        .section-block {
            margin-bottom: 20px;
        }

        .section-label {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #8a8aaa;
            border-bottom: 1px dashed #e6e8f0;
            padding-bottom: 4px;
            margin-bottom: 4px;
        }

        .section-content {
            font-size: 15px;
            line-height: 1.8;
            color: #2c2c3e;
            padding: 6px 0 2px 4px;
        }

        /* Markdown 样式 */
        .section-content p { margin-bottom: 6px; }
        .section-content ul, .section-content ol { padding-left: 22px; margin: 6px 0; }
        .section-content li { margin-bottom: 3px; }
        .section-content code { background: #f0f2fa; padding: 0 6px; border-radius: 4px; font-size: 14px; color: #3d3363; }
        .section-content a { color: #6b5b9e; text-decoration: none; }
        .section-content a:hover { text-decoration: underline; }
        .section-content blockquote {
            border-left: 3px solid #d4cbff;
            padding-left: 14px;
            margin: 6px 0;
            color: #5a5a7a;
        }
        .section-content .empty-hint { color: #b8b8d0; font-style: italic; font-size: 14px; }

        /* 标签 */
        .tag-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f0f2f8;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: #f0f2fa;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 13px;
            color: #5a5a7a;
        }

        .tag.person {
            background: #e8e4f5;
            color: #4f3f7a;
        }

        @media (max-width: 600px) {
            .profile-card { padding: 20px; }
            .profile-header { flex-direction: column; text-align: center; gap: 12px; }
            .avatar { width: 60px; height: 60px; font-size: 28px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== 返回链接 ===== -->
    <a href="../index.html" class="back-link">← 返回Minemob列表</a>

    <!-- ===== 主卡片 ===== -->
    <div class="profile-card">

        <!-- ===== 头部：头像 + 姓名 ===== -->
        <div class="profile-header">
            <div class="avatar">😊</div>
            <div class="name-title">
                <h1>Minemob姓名</h1>
                <div class="sub">Minemob · 神人</div>
            </div>
        </div>

        <!-- ===== 板块1：概述 ===== -->
        <div class="section-block">
            <div class="section-label">📋 概述</div>
            <div class="section-content" id="overview">
                <!-- 在这里写概述内容，支持 Markdown -->
            </div>
        </div>

        <!-- ===== 板块2：行为 ===== -->
        <div class="section-block">
            <div class="section-label">⚡ 行为</div>
            <div class="section-content" id="behavior">
                <!-- 在这里写行为描述，支持 Markdown -->
            </div>
        </div>

        <!-- ===== 板块3：神人时间 ===== -->
        <div class="section-block">
            <div class="section-label">🌀 神人时间</div>
            <div class="section-content" id="shenrenTime">
                <!-- 在这里写神人时间，支持 Markdown -->
            </div>
        </div>

        <!-- ===== 板块4：你知道吗 ===== -->
        <div class="section-block">
            <div class="section-label">💡 你知道吗</div>
            <div class="section-content" id="trivia">
                <!-- 在这里写冷知识/趣闻，支持 Markdown -->
            </div>
        </div>

        <!-- ===== 标签 ===== -->
        <div class="tag-section">
            <span class="tag"># 标签1</span>
            <span class="tag"># 标签2</span>
            <span class="tag person"># 神人</span>
        </div>

    </div>
    <!-- ===== 主卡片结束 ===== -->

</div>

<script>
    // ============================================================
    //  📝 在这里填写同学数据（支持 Markdown）
    //  直接修改下方对应变量的内容即可
    // ============================================================

    const studentName = '';//同学姓名
    const studentAvatar = '';//😊
    const studentSub = '';//✦ 同学 · 神人

    const overviewContent = `
        
    `;
	//<!-- 在这里写概述，支持 Markdown -->
    //    例如：**班级知名人物**，以 *抽象行为* 闻名。
    const behaviorContent = `
        
    `;
//<!-- 在这里写行为 -->
    const shenrenTimeContent = `
        
    `;
//<!-- 在这里写冷知识 -->> 据说…… 
    const triviaContent = `
        
    `;

    const tags = [];
//'标签1', '标签2', '神人'
    // ========== 渲染（不用动） ==========
    document.querySelector('.avatar').textContent = studentAvatar;
    document.querySelector('.name-title h1').textContent = studentName;
    document.querySelector('.name-title .sub').textContent = studentSub;

    document.getElementById('overview').innerHTML = marked.parse(overviewContent);
    document.getElementById('behavior').innerHTML = marked.parse(behaviorContent);
    document.getElementById('shenrenTime').innerHTML = marked.parse(shenrenTimeContent);
    document.getElementById('trivia').innerHTML = marked.parse(triviaContent);

    // 标签
    const tagContainer = document.querySelector('.tag-section');
    tagContainer.innerHTML = '';
    tags.forEach(t => {
        const span = document.createElement('span');
        span.className = 'tag' + (t === '神人' ? ' person' : '');
        span.textContent = '# ' + t;
        tagContainer.appendChild(span);
    });

    // 页面标题
    document.title = `Minemob百科 · ${studentName}`;
</script>

</body>
</html>
