<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>· 轻律 · 音乐播放器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; }

  body {
    min-height: 100vh;
    background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .player-card {
    max-width: 700px; width: 100%;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(10px);
    border-radius: 2.5rem; padding: 2rem;
    box-shadow: 0 25px 40px -12px rgba(0, 20, 30, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.5);
    transition: background 0.4s ease, border-color 0.4s ease;
  }

  h1 { font-size: 1.9rem; font-weight: 500; color: #1c3b4f; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem; }
  h1 span { background: #1c3b4f; color: white; font-size: 1rem; padding: 0.2rem 0.9rem; border-radius: 40px; font-weight: 400; }

  .subhead {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 1.75rem; color: #4d6a7e; font-size: 0.9rem;
    border-bottom: 1px dashed rgba(100, 130, 150, 0.2); padding-bottom: 0.75rem;
  }
  .track-count { background: #e2eef7; padding: 0.2rem 0.9rem; border-radius: 30px; font-size: 0.8rem; font-weight: 500; color: #1f4b63; }

  .audio-wrapper {
    background: #ffffffd9; border-radius: 1.8rem;
    padding: 0.75rem 0.75rem 0.75rem 1.5rem;
    display: flex; align-items: center; gap: 0.75rem;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02), inset 0 1px 4px #ffffff;
    border: 1px solid #ffffff; margin-bottom: 1.2rem;
  }
  audio { flex: 1; height: 48px; border-radius: 40px; outline: none; background: #f0f6fc; min-width: 0; }

  .btn {
    background: #ffffff; border: none; width: 48px; height: 48px; border-radius: 40px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02), 0 0 0 1px #ffffff inset, 0 0 0 1px #cbdae6;
    transition: 0.15s; color: #2a5c7a; flex-shrink: 0; font-size: 1.3rem;
  }
  .btn:hover { background: #e3f0fa; }
  .btn:active { transform: scale(0.94); }

  /* 单曲循环按钮：激活态 */
  .btn.active {
    background: #1c3b4f;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(28, 59, 79, 0.35), 0 0 0 1px #1c3b4f inset;
  }
  .btn.active:hover { background: #2a5c7a; }

  .toolbar { display: flex; gap: 0.6rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  .toolbar .btn { width: auto; padding: 0 1.2rem; height: 42px; font-size: 0.9rem; gap: 0.4rem; }

  .list-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 0.4rem; margin-bottom: 0.75rem;
    color: #2a5c7a; font-weight: 500; font-size: 0.95rem;
  }
  .list-header span:last-child { font-size: 0.75rem; font-weight: 400; background: #d9e8f2; padding: 0.2rem 0.7rem; border-radius: 20px; color: #0e374d; }

  .playlist-container { max-height: 320px; overflow-y: auto; padding-right: 0.25rem; border-radius: 1rem; }
  .playlist-container::-webkit-scrollbar { width: 5px; }
  .playlist-container::-webkit-scrollbar-track { background: #e3edf5; border-radius: 10px; }
  .playlist-container::-webkit-scrollbar-thumb { background: #b6cfdf; border-radius: 10px; }

  .playlist { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .playlist li {
    padding: 0.8rem 1.2rem; background: #ffffffb3; backdrop-filter: blur(2px);
    border-radius: 1.2rem; display: flex; align-items: center; gap: 0.8rem;
    font-size: 0.95rem; color: #1a3a4c; border: 1px solid #ffffff;
    cursor: pointer; transition: all 0.12s ease; word-break: break-all;
  }
  .playlist li:hover { background: #ffffff; border-color: #9ec3dc; transform: translateY(-1px); }
  .playlist li.active { background: #e1f0fc; border: 1px solid #7bb3d4; color: #0a2c40; font-weight: 500; }
  .playlist li.active::before { content: "♪"; color: #1b6c99; margin-right: 0.2rem; }

  .empty-message {
    text-align: center; padding: 2.2rem 1rem; background: #e7f0f7;
    border-radius: 1.8rem; color: #436d87; font-style: italic;
    border: 1px dashed #b8d2e4; font-size: 0.95rem;
  }

  .footer-note { margin-top: 1.5rem; text-align: center; font-size: 0.7rem; color: #7f9aad; opacity: 0.7; }

  /* ===== 暗色主题 ===== */
  body.dark-theme { background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%); }
  body.dark-theme .player-card {
    background: rgba(30, 30, 45, 0.85);
    border-color: rgba(255, 255, 255, 0.08);
    box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.6);
  }
  body.dark-theme h1 { color: #e0e0e0; }
  body.dark-theme h1 span { background: #4a90d9; }
  body.dark-theme .subhead { color: #9ab0c4; border-bottom-color: rgba(255, 255, 255, 0.1); }
  body.dark-theme .track-count { background: #2a3a4a; color: #b8d4e8; }
  body.dark-theme .audio-wrapper { background: rgba(40, 40, 55, 0.9); border-color: rgba(255, 255, 255, 0.08); }
  body.dark-theme audio { background: #2a2a3a; }
  body.dark-theme .btn {
    background: #2d2d3a; color: #b8d4e8;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2), 0 0 0 1px #2d2d3a inset, 0 0 0 1px #444;
  }
  body.dark-theme .btn:hover { background: #3d3d4a; }
  body.dark-theme .btn.active { background: #4a90d9; color: #fff; box-shadow: 0 4px 12px rgba(74, 144, 217, 0.5); }
  body.dark-theme .btn.active:hover { background: #357abd; }
  body.dark-theme .list-header { color: #b8d4e8; }
  body.dark-theme .list-header span:last-child { background: #2a3a4a; color: #b8d4e8; }
  body.dark-theme .playlist li { background: rgba(45, 45, 58, 0.7); border-color: rgba(255, 255, 255, 0.06); color: #d0d8e0; }
  body.dark-theme .playlist li:hover { background: rgba(55, 55, 70, 0.9); border-color: #4a90d9; }
  body.dark-theme .playlist li.active { background: #2a3a4a; border-color: #4a90d9; color: #e0e0e0; }
  body.dark-theme .playlist li.active::before { color: #6ab0f7; }
  body.dark-theme .empty-message { background: #2a2a3a; color: #9ab0c4; border-color: #444; }
  body.dark-theme .footer-note { color: #6a7a8a; }

  @media (max-width: 480px) {
    .player-card { padding: 1.5rem 1.2rem; }
    h1 { font-size: 1.5rem; }
    .toolbar .btn { padding: 0 0.8rem; font-size: 0.8rem; }
  }
</style>
</head>
<body>
<div class="player-card">
  <h1>🎧 轻律 <span>auto</span></h1>
  <div class="subhead">
    <span>音频播放器</span>
    <span class="track-count" id="trackCount">0 首</span>
  </div>

  <div class="audio-wrapper">
    <audio id="audioPlayer" controls preload="metadata"></audio>
    <button class="btn" id="refreshBtn" title="重新加载列表">⟳</button>
  </div>

  <div class="toolbar">
    <button class="btn active" id="loopToggleBtn" title="当前：列表循环">🔁 列表循环</button>
    <button class="btn" id="pickFilesBtn" title="从本地选择文件">🎵 选择文件</button>
    <input type="file" id="filesInput" multiple accept="audio/*" style="display:none">
  </div>

  <div class="list-header">
    <span>📋 播放列表</span>
    <span id="listHint">等待加载</span>
  </div>

  <div class="playlist-container" id="playlistContainer">
    <ul class="playlist" id="playlist"></ul>
    <div class="empty-message" id="emptyMessage">
      ⚡ 当前没有音频文件<br>
      <small style="opacity:0.7">请检查音频文件是否已上传</small>
    </div>
  </div>
  <div class="footer-note">支持 mp3 / wav / ogg / m4a / flac 等格式</div>
</div>

<script>
(function() {
  const AUDIO_EXTENSIONS = ['mp3','wav','ogg','m4a','flac','aac','opus','webm','mp4','m4b','oga'];

  const audio = document.getElementById('audioPlayer');
  const playlistEl = document.getElementById('playlist');
  const emptyMessage = document.getElementById('emptyMessage');
  const trackCountSpan = document.getElementById('trackCount');
  const refreshBtn = document.getElementById('refreshBtn');
  const listHint = document.getElementById('listHint');
  const loopToggleBtn = document.getElementById('loopToggleBtn');
  const pickFilesBtn = document.getElementById('pickFilesBtn');
  const filesInput = document.getElementById('filesInput');

  let tracks = [];
  let currentTrackIndex = -1;
  let currentObjectUrls = [];
  let isScanning = false;
  let loopMode = localStorage.getItem('playerLoopMode') || 'list'; // 'list' | 'single'

  // ===== 写死的音频列表（相对于本页面所在目录） =====
  const AUDIO_FILES = [
  '24_7.mp3',
  'Class Clown.mp3',
  'Dead Inside.mp3',
  'Death Is No More.mp3',
  'exile.mp3',
  'Far Away From Home.mp3',
  'Five hundred miles.mp3',
  'Free Loop.mp3',
  'GHOST.mp3',
  'Go Solo.mp3',
  'hypnotic.mp3',
  'i walk this earth all by myself.mp3',
  'Just Like Fire.mp3',
  'Maybe.mp3',
  'Normal No More.mp3',
  'POOR.mp3',
  'Sea Of Problems.mp3',
  'Sinos De Natal.mp3',
  'Six Feet Under.mp3',
  'So Far Away.mp3',
  'Take me hand.mp3',
  'The Way I Still Love You.mp3',
  'Trip.mp3',
  'Unchanged Mind.mp3',
  'Vem Vem.mp3',
  'Wake Up.mp3',
  'what are words4.mp3',
  'What Makes You Beautiful.mp3',
  'Why not.mp3',
  'X-cool.mp3',
  '深渊.mp3',
  // ===== 新增的 m4a =====
  'Faded.m4a',
  '达拉崩吧.m4a',
  '海屿你.m4a',
  '狂欢在那神佑的山巅.m4a',
  '十年人间.m4a',
  '忘川彼岸.m4a',
  '五十五天在北京.m4a',
  '误闯天家.m4a',
  '像个笨蛋一样.m4a',
  '耀眼.m4a',
  '只对你有感觉.m4a'
];
  function isAudioFile(filename) {
    if (!filename) return false;
    const parts = filename.split('.');
    if (parts.length < 2) return false;
    return AUDIO_EXTENSIONS.includes(parts.pop().toLowerCase());
  }

  function updateTrackCount() {
    trackCountSpan.textContent = tracks.length + ' 首';
  }

  function toggleEmptyState(show) {
    emptyMessage.style.display = show ? 'block' : 'none';
    playlistEl.style.display = show ? 'none' : 'flex';
  }

  function resetPlayer() {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    currentTrackIndex = -1;
    document.querySelectorAll('.playlist li').forEach(li => li.classList.remove('active'));
  }

  function revokeObjectUrls() {
    currentObjectUrls.forEach(url => {
      try { URL.revokeObjectURL(url); } catch(e) {}
    });
    currentObjectUrls = [];
  }

  function highlightTrack(index) {
    const items = playlistEl.querySelectorAll('li');
    items.forEach((li, i) => {
      li.classList.toggle('active', i === index);
    });
  }

  function playTrackByIndex(index) {
    if (index < 0 || index >= tracks.length) return;
    const track = tracks[index];

    audio.src = track.url;
    audio.load();

    const p = audio.play();
    if (p !== undefined) {
      p.catch(err => {
        console.warn('自动播放被阻止:', err);
        listHint.textContent = '点击 ▶ 播放';
      });
    }

    currentTrackIndex = index;
    highlightTrack(index);
    listHint.textContent = '正在播放';
  }

  function renderPlaylist() {
    playlistEl.innerHTML = '';

    if (tracks.length === 0) {
      toggleEmptyState(true);
      updateTrackCount();
      resetPlayer();
      listHint.textContent = '无音频';
      return;
    }

    toggleEmptyState(false);

    tracks.forEach((track, index) => {
      const li = document.createElement('li');
      li.textContent = track.name;
      li.dataset.index = index;
      li.addEventListener('click', () => playTrackByIndex(index));
      playlistEl.appendChild(li);
    });

    updateTrackCount();
    resetPlayer();
    listHint.textContent = '点击播放';
  }

  // ===== 从写死的列表加载 =====
  function loadBuiltInTracks() {
    const valid = AUDIO_FILES.filter(name => isAudioFile(name));
    tracks = valid
      .sort((a, b) => a.localeCompare(b))
      .map(name => ({
        name,
        url: encodeURIComponent(name)
      }));

    renderPlaylist();
    listHint.textContent = tracks.length > 0 ? '准备就绪' : '未找到音频';
  }

  // ===== 从本地文件加载 =====
  function loadFromFileList(fileList) {
    if (!fileList || fileList.length === 0) return;

    revokeObjectUrls();
    const newTracks = [];

    Array.from(fileList).forEach(file => {
      const isAudioByMime = file.type && file.type.startsWith('audio/');
      if (!isAudioByMime && !isAudioFile(file.name)) return;

      const url = URL.createObjectURL(file);
      currentObjectUrls.push(url);
      newTracks.push({ name: file.name, url });
    });

    if (newTracks.length === 0) {
      listHint.textContent = '未找到音频';
      return;
    }

    newTracks.sort((a, b) => a.name.localeCompare(b.name));
    tracks = newTracks;
    renderPlaylist();
    listHint.textContent = '准备就绪';
  }

  // ===== 单曲循环 / 列表循环 =====
  function applyLoopModeToAudio() {
    // 单曲循环用 audio.loop 控制；列表循环交给 ended 事件
    audio.loop = (loopMode === 'single');
  }

  function updateLoopBtnUI() {
    if (loopMode === 'single') {
      loopToggleBtn.textContent = '🔂 单曲循环';
      loopToggleBtn.classList.add('active');
      loopToggleBtn.title = '当前：单曲循环';
    } else {
      loopToggleBtn.textContent = '🔁 列表循环';
      loopToggleBtn.classList.add('active');
      loopToggleBtn.title = '当前：列表循环';
    }
  }

  function toggleLoopMode() {
    loopMode = (loopMode === 'list') ? 'single' : 'list';
    localStorage.setItem('playerLoopMode', loopMode);
    applyLoopModeToAudio();
    updateLoopBtnUI();
    listHint.textContent = loopMode === 'single' ? '单曲循环' : '列表循环';
  }

  // ===== 事件绑定 =====
  refreshBtn.addEventListener('click', () => {
    revokeObjectUrls();
    tracks = [];
    loadBuiltInTracks();
  });

  loopToggleBtn.addEventListener('click', toggleLoopMode);

  pickFilesBtn.addEventListener('click', () => filesInput.click());

  filesInput.addEventListener('change', (e) => {
    loadFromFileList(e.target.files);
    filesInput.value = '';
  });

  audio.addEventListener('play', () => { listHint.textContent = '播放中'; });
  audio.addEventListener('pause', () => {
    if (!audio.ended) listHint.textContent = '已暂停';
  });
  audio.addEventListener('error', () => {
    if (audio.src) listHint.textContent = '加载失败';
  });

  // 列表循环时，播完自动下一首
  audio.addEventListener('ended', () => {
    if (loopMode === 'single') return; // audio.loop 已处理
    if (tracks.length === 0) return;
    let next = currentTrackIndex + 1;
    if (next >= tracks.length) next = 0;
    playTrackByIndex(next);
  });

  // ===== 初始化 =====
  window.addEventListener('load', () => {
    applyLoopModeToAudio();
    updateLoopBtnUI();
    loadBuiltInTracks();
  });

  window.addEventListener('beforeunload', revokeObjectUrls);
})();
</script>
</body>
</html>
