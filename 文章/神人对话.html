                { scene: "食堂", lines: ["A：为什么鸡排是0？", "B：因为猪吃猪食，鸡吃鸡食，它们吃零食。"] },
                { scene: "操场", lines: ["A：那个π是几维的？", "B：三维，但看起来像二维。"] },
                { scene: "教室", lines: ["A：我复制自己可以吗？", "B：可以，但会被管理员踢。"] },
                { scene: "校门口", lines: ["A：小胖的刀钝了。", "B：他需要'节肢杀手'附魔。"] },
                { scene: "食堂", lines: ["A：我喝冰红茶浇头，然后呢？", "B：然后爬行，对着月亮说'今天太阳真大'。"] }
            ];

            const allDialogs = dialogs.concat(extraDialogs);

            // 确保正好100条
            while (allDialogs.length < 100) {
                allDialogs.push({
                    scene: "虚空",
                    lines: ["A：yee？", "B：yee！"]
                });
            }
            if (allDialogs.length > 100) allDialogs.length = 100;

            const container = document.getElementById('dialogContainer');
            let html = '';

            allDialogs.forEach((item, index) => {
                const num = index + 1;
                html += `<div class="dialog-item">`;
                html += `<div class="scene">场景 ${num} · ${item.scene}</div>`;
                item.lines.forEach(line => {
                    // 简单美化 speaker
                    let speaker = line.charAt(0);
                    let text = line.substring(3);
                    if (speaker === 'A') {
                        html += `<div class="line"><span class="speaker-a">A</span> ${text}</div>`;
                    } else if (speaker === 'B') {
                        html += `<div class="line"><span class="speaker-b">B</span> ${text}</div>`;
                    } else if (speaker === '大' && line.includes('大妈')) {
                        html += `<div class="line"><span style="color:#b35c5c;">大妈</span> ${line.replace('大妈：', '')}</div>`;
                    } else {
                        html += `<div class="line">${line}</div>`;
                    }
                });
                html += `</div>`;
            });

            container.innerHTML = html;
        })();
    </script>
