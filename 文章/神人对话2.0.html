                    if (speaker === 'A') {
                        html += `<div class="line"><span class="speaker-a">A</span> ${text}</div>`;
                    } else if (speaker === 'B') {
                        html += `<div class="line"><span class="speaker-b">B</span> ${text}</div>`;
                    } else if (speaker === '大' && line.includes('大妈')) {
                        html += `<div class="line"><span style="color:#b35c5c;">大妈</span> ${line.replace('大妈：', '')}</div>`;
                    } else {
                        html += `<div class="line">${line}</div>`;
                    }
                });
                html += `</div>`;
            });

            container.innerHTML = html;
        })();
    </script>

            "anti-debug": "https://cdn.jsdelivr.net/npm/@sgysldz/anti-debug@1.0.0/dist/index.js"
        }
    }

        });
