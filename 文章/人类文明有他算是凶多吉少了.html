        * {
            margin: 0;

        body {
            background: #fff;
            color: #000;
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.5;

        }

        /* 顶部导航栏 */
        .reader-header {
            padding: 10px 20px;
            background: #3d3363;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;

        }

        #chapterSelect option {
            background: #3d3363;
        }

        /* 正文容器 */
        .content-box {
            max-width: 850px;
            margin: 5px auto;
            padding: 0 20px 30px;
            font-size: 17px;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: calc(100vh - 140px);
        }

        .content-box h4 {
            margin: 16px 0 8px;
            color: #3d3363;
        }

        .content-box p {
            margin-bottom: 2px;
            text-indent: 2em;
        }

        .content-box a {
            color: #4f437a;
            text-decoration: none;
        }

        .content-box a:hover {
            text-decoration: underline;
        }

        /* 禁止复制提示 */
        .no-copy-tip {
            text-align: center;
            color: #a89bff;
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
