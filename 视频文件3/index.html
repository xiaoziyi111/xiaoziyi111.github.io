<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放器</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .player-container {
            max-width: 1100px;
            width: 100%;
            background: #1e2028;
            border-radius: 2.5rem;
            padding: 2rem 2rem 2.2rem;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.05);
            border: 1px solid #2d303a;
        }
        /* 主播放区域 */
        .video-wrapper {
            background: #0b0d11;
            border-radius: 1.8rem;
            overflow: hidden;
            margin-bottom: 1.8rem;
            border: 1px solid #2b2e38;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
        }
        .video-wrapper video {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #000;
            outline: none;
        }
        /* 当前播放信息 */
        .now-playing {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 0.4rem 1rem 0.4rem;
            color: #c8ccd8;
            border-bottom: 1px dashed rgba(100, 130, 150, 0.25);
            margin-bottom: 1.2rem;
        }
        .now-playing .title {
            font-size: 1.35rem;
            font-weight: 500;
            color: #f0f3fa;
            letter-spacing: 0.3px;
        }
        .now-playing .meta {
            font-size: 0.85rem;
            background: #282c36;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            color: #b0b8c8;
            font-weight: 400;
        }
        /* 列表标题 */
        .list-header {
            display: flex;
            justify-content: space-between;
            color: #8e96a8;
            font-size: 0.9rem;
            padding: 0 0.4rem 0.8rem 0.4rem;
            border-bottom: 1px dashed rgba(100, 130, 150, 0.2);
            letter-spacing: 0.3px;
            font-weight: 500;
        }
        .list-header span:first-child { margin-left: 0.2rem; }
        .list-header span:last-child { margin-right: 0.2rem; }
        /* 滚动列表 */
        .playlist {
            max-height: 340px;
            overflow-y: auto;
            margin-top: 0.8rem;
            padding-right: 0.3rem;
            border-radius: 1rem;
        }
        .playlist::-webkit-scrollbar {
            width: 5px;
        }
        .playlist::-webkit-scrollbar-track {
            background: #1a1c24;
            border-radius: 10px;
        }
        .playlist::-webkit-scrollbar-thumb {
            background: #3e4352;
            border-radius: 10px;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1rem 0.8rem 1.2rem;
            margin: 4px 0;
            border-radius: 1.2rem;
            cursor: pointer;
            transition: all 0.15s ease;
            color: #cbd0dc;
            border: 1px solid transparent;
            background: rgba(30, 32, 40, 0.6);
        }
        .playlist-item:hover {
            background: #282d3a;
            color: #f0f4ff;
            transform: translateY(-1px);
            border-color: #5a6a8a;
        }
        .playlist-item.active {
            background: #2e3442;
            border-color: #5a6a8a;
            color: #ffffff;
            box-shadow: 0 0 0 1px #3f4b66;
            font-weight: 500;
        }
        .playlist-item.active .file-name::before {
            content: "♪";
            color: #9bb8d4;
            margin-right: 0.4rem;
            font-size: 1rem;
        }
        .playlist-item .file-name {
            font-weight: 500;
            font-size: 0.98rem;
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-word;
        }
        .playlist-item .file-name .badge {
            font-size: 0.7rem;
            background: #2f3545;
            color: #aab2c8;
            padding: 2px 8px;
            border-radius: 30px;
            font-weight: 400;
            flex-shrink: 0;
        }
        .playlist-item .file-meta {
            font-size: 0.8rem;
            color: #8f97ac;
            background: #1b1e28;
            padding: 2px 12px;
            border-radius: 30px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .playlist-item.active .file-meta {
            background: #3a4054;
            color: #d3dae8;
        }
        .empty-state {
            text-align: center;
            padding: 2.2rem 1rem;
            color: #6b738a;
            background: #1a1c24;
            border-radius: 1.8rem;
            border: 1px dashed #3e4352;
            font-style: italic;
        }
        .key-hint {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #7f8a9e;
            text-align: center;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }
        .key-hint kbd {
            background: #222632;
            padding: 2px 12px;
            border-radius: 30px;
            color: #bcc3d6;
            border: 1px solid #373d4e;
            margin: 0 4px;
            font-family: inherit;
            font-size: 0.75rem;
        }
        @media (max-width: 600px) {
            .player-container { padding: 1.2rem; }
            .now-playing { flex-direction: column; gap: 6px; }
            .playlist-item { flex-wrap: wrap; gap: 6px; }
            .playlist-item .file-meta { margin-left: auto; }
            .now-playing .title { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<div class="player-container" role="main">
    <!-- 视频播放器 -->
    <div class="video-wrapper">
        <video id="mainVideo" controls preload="metadata" playsinline>
            <source id="videoSource" src="" type="video/mp4">
            您的浏览器不支持 HTML5 视频播放。
        </video>
    </div>

    <!-- 当前播放信息 -->
    <div class="now-playing">
        <span class="title" id="currentTitle">🎬 选择视频开始</span>
        <span class="meta" id="currentMeta">—</span>
    </div>

    <!-- 列表标题 -->
    <div class="list-header">
        <span>📁 播放列表 · 何为张力</span>
        <span>时长 / 大小</span>
    </div>

    <!-- 播放列表 -->
    <div class="playlist" id="playlistContainer" role="list">
        <!-- 由 JavaScript 动态生成 -->
    </div>
    <div class="key-hint">
        <kbd>↑</kbd> <kbd>↓</kbd> 键切换视频
    </div>
</div>

<script>
    (function() {
        // ------------------------------------------------------------
        // 1. 视频数据 (根据你提供的文件列表)
        //    请确保文件名和实际文件完全一致 (包括 .mp4)
        // ------------------------------------------------------------
        const videoData = [
            { name: '你好世界', size: '? KB', duration: '?' },
        ];

        // ------------------------------------------------------------
        // 2. DOM 元素
        // ------------------------------------------------------------
        const video = document.getElementById('mainVideo');
        const source = document.getElementById('videoSource');
        const currentTitle = document.getElementById('currentTitle');
        const currentMeta = document.getElementById('currentMeta');
        const playlistEl = document.getElementById('playlistContainer');

        let currentIndex = 0;          // 当前播放视频的索引

        // ------------------------------------------------------------
        // 3. 核心函数：加载视频
        // ------------------------------------------------------------
        function loadVideo(index) {
            if (index < 0 || index >= videoData.length) return;

            const item = videoData[index];
            const filePath = `${item.name}.mp4`;

            source.src = filePath;
            video.load();

            currentTitle.textContent = `🎬 ${item.name}`;
            currentMeta.textContent = `${item.duration} · ${item.size}`;

            const allItems = playlistEl.querySelectorAll('.playlist-item');
            allItems.forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            setTimeout(() => {
                video.play().catch(() => {
                    // 自动播放被浏览器阻止时静默处理
                });
            }, 100);

            currentIndex = index;
        }

        // ------------------------------------------------------------
        // 4. 生成播放列表
        // ------------------------------------------------------------
        function renderPlaylist() {
            playlistEl.innerHTML = '';
            videoData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'playlist-item';
                div.setAttribute('role', 'listitem');
                div.dataset.index = index;

                const nameSpan = document.createElement('span');
                nameSpan.className = 'file-name';
                nameSpan.innerHTML = `
                    ${item.name}
                    <span class="badge">MP4</span>
                `;

                const metaSpan = document.createElement('span');
                metaSpan.className = 'file-meta';
                metaSpan.textContent = `${item.duration} · ${item.size}`;

                div.appendChild(nameSpan);
                div.appendChild(metaSpan);

                div.addEventListener('click', function(e) {
                    const idx = parseInt(this.dataset.index, 10);
                    if (idx !== currentIndex) {
                        loadVideo(idx);
                    } else {
                        video.currentTime = 0;
                        video.play().catch(() => {});
                    }
                });

                playlistEl.appendChild(div);
            });

            if (videoData.length > 0) {
                loadVideo(0);
            } else {
                currentTitle.textContent = '⚠️ 没有视频';
                playlistEl.innerHTML = '<div class="empty-state">暂无视频文件</div>';
            }
        }

        // ------------------------------------------------------------
        // 5. 键盘事件：上下键切换
        // ------------------------------------------------------------
        function handleKeydown(e) {
            const tag = e.target.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

            const key = e.key;
            if (key === 'ArrowUp') {
                e.preventDefault();
                const newIndex = Math.max(0, currentIndex - 1);
                if (newIndex !== currentIndex) loadVideo(newIndex);
            } else if (key === 'ArrowDown') {
                e.preventDefault();
                const newIndex = Math.min(videoData.length - 1, currentIndex + 1);
                if (newIndex !== currentIndex) loadVideo(newIndex);
            }
        }

        // ------------------------------------------------------------
        // 6. 初始化
        // ------------------------------------------------------------
        renderPlaylist();
        window.addEventListener('keydown', handleKeydown);

        video.addEventListener('error', function() {
            const fileName = videoData[currentIndex]?.name || '未知';
            console.warn(`视频加载失败: ${fileName}.mp4`);
            currentTitle.textContent = `❌ 加载失败: ${fileName}`;
            currentMeta.textContent = '请检查文件是否存在';
        });

        video.addEventListener('canplay', function() {
            if (currentTitle.textContent.includes('加载失败')) {
                const item = videoData[currentIndex];
                if (item) {
                    currentTitle.textContent = `🎬 ${item.name}`;
                    currentMeta.textContent = `${item.duration} · ${item.size}`;
                }
            }
        });

        window.addEventListener('beforeunload', function() {
            window.removeEventListener('keydown', handleKeydown);
        });

        console.log(`✅ 播放器已启动，共 ${videoData.length} 个视频`);
    })();
</script>
</body>
</html>
