<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何为张力 · 视频播放器</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0f1117;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .player-container {
            max-width: 1100px;
            width: 100%;
            background: #1e2028;
            border-radius: 32px;
            padding: 28px 28px 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            border: 1px solid #2d303a;
        }
        /* 主播放区域 */
        .video-wrapper {
            background: #0b0d11;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            margin-bottom: 24px;
            border: 1px solid #2b2e38;
        }
        .video-wrapper video {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #000;
            outline: none;
        }
        /* 播放信息 */
        .now-playing {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 6px 16px 6px;
            color: #c8ccd8;
            border-bottom: 1px solid #2a2d37;
        }
        .now-playing .title {
            font-size: 1.35rem;
            font-weight: 600;
            color: #f0f3fa;
            letter-spacing: 0.3px;
        }
        .now-playing .meta {
            font-size: 0.9rem;
            background: #282c36;
            padding: 4px 14px;
            border-radius: 40px;
            color: #b0b8c8;
        }
        /* 列表标题 */
        .list-header {
            display: flex;
            justify-content: space-between;
            color: #8e96a8;
            font-size: 0.85rem;
            padding: 14px 8px 8px 8px;
            border-bottom: 1px solid #282c36;
            letter-spacing: 0.3px;
        }
        .list-header span:first-child { margin-left: 4px; }
        .list-header span:last-child { margin-right: 12px; }
        /* 滚动列表 */
        .playlist {
            max-height: 340px;
            overflow-y: auto;
            margin-top: 6px;
            padding-right: 4px;
        }
        .playlist::-webkit-scrollbar {
            width: 6px;
        }
        .playlist::-webkit-scrollbar-track {
            background: #1a1c24;
            border-radius: 12px;
        }
        .playlist::-webkit-scrollbar-thumb {
            background: #3e4352;
            border-radius: 12px;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 12px 12px 16px;
            margin: 4px 0;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            color: #cbd0dc;
            border: 1px solid transparent;
        }
        .playlist-item:hover {
            background: #282d3a;
            color: #f0f4ff;
        }
        .playlist-item.active {
            background: #2e3442;
            border-color: #5a6a8a;
            color: #ffffff;
            box-shadow: 0 0 0 1px #3f4b66;
        }
        .playlist-item .file-name {
            font-weight: 500;
            font-size: 0.98rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .playlist-item .file-name .badge {
            font-size: 0.7rem;
            background: #2f3545;
            color: #aab2c8;
            padding: 2px 8px;
            border-radius: 30px;
            font-weight: 400;
        }
        .playlist-item .file-meta {
            font-size: 0.8rem;
            color: #8f97ac;
            background: #1b1e28;
            padding: 2px 12px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .playlist-item.active .file-meta {
            background: #3a4054;
            color: #d3dae8;
        }
        .empty-state {
            text-align: center;
            padding: 40px 10px;
            color: #6b738a;
        }
        .key-hint {
            margin-top: 18px;
            font-size: 0.8rem;
            color: #5d657b;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .key-hint kbd {
            background: #222632;
            padding: 2px 12px;
            border-radius: 30px;
            color: #bcc3d6;
            border: 1px solid #373d4e;
            margin: 0 4px;
        }
        @media (max-width: 600px) {
            .player-container { padding: 16px; }
            .now-playing { flex-direction: column; gap: 6px; }
            .playlist-item { flex-wrap: wrap; gap: 6px; }
            .playlist-item .file-meta { margin-left: auto; }
        }
    </style>
</head>
<body>

<div class="player-container" role="main">
    <!-- 视频播放器 -->
    <div class="video-wrapper">
        <video id="mainVideo" controls preload="metadata" playsinline>
            <source id="videoSource" src="" type="video/mp4">
            您的浏览器不支持 HTML5 视频播放。
        </video>
    </div>

    <!-- 当前播放信息 -->
    <div class="now-playing">
        <span class="title" id="currentTitle">🎬 选择视频开始</span>
        <span class="meta" id="currentMeta">—</span>
    </div>

    <!-- 列表标题 -->
    <div class="list-header">
        <span>📁 播放列表 · 何为张力</span>
        <span>时长 / 大小</span>
    </div>

    <!-- 播放列表 -->
    <div class="playlist" id="playlistContainer" role="list">
        <!-- 由 JavaScript 动态生成 -->
    </div>
    <div class="key-hint">
        <kbd>↑</kbd> <kbd>↓</kbd> 键切换视频
    </div>
</div>

<script>
    (function() {
        // ------------------------------------------------------------
        // 1. 视频数据 (根据你提供的文件列表)
        //    请确保文件名和实际文件完全一致 (包括 .mp4)
        // ------------------------------------------------------------
        const videoData = [
            { name: '何为张力9.0', size: '608 KB', duration: '00:00:36' },
            { name: '何为张力13.0', size: '612 KB', duration: '00:00:36' },
            { name: '何为张力14.0', size: '648 KB', duration: '00:00:36' },
            { name: '何为张力15.0', size: '677 KB', duration: '00:00:36' },
            { name: '何为张力16.0', size: '608 KB', duration: '00:00:36' },
            { name: '何为张力17.0', size: '663 KB', duration: '00:00:36' },
            { name: '何为张力18.0', size: '682 KB', duration: '00:00:36' },
            { name: '何为张力19.0', size: '652 KB', duration: '00:00:36' },
            { name: '何为张力20.0', size: '752 KB', duration: '00:00:36' },
            { name: '何为张力21.0', size: '775 KB', duration: '00:00:36' },
            { name: '何为张力22.0', size: '825 KB', duration: '00:00:36' },
            { name: '何为张力23.0', size: '875 KB', duration: '00:00:36' },
            { name: '何为张力24.0', size: '912 KB', duration: '00:00:36' },
            { name: '何为张力25.0', size: '950 KB', duration: '00:00:36' },
            { name: '何为张力29.0', size: '623 KB', duration: '00:00:36' },
            { name: '何为张力31.0', size: '770 KB', duration: '00:00:40' },
            { name: '何为张力32.0', size: '637 KB', duration: '00:00:36' },
            { name: '何为张力33.0', size: '702 KB', duration: '00:00:36' },
            { name: '何为张力34.0', size: '611 KB', duration: '00:00:36' }
        ];

        // ------------------------------------------------------------
        // 2. DOM 元素
        // ------------------------------------------------------------
        const video = document.getElementById('mainVideo');
        const source = document.getElementById('videoSource');
        const currentTitle = document.getElementById('currentTitle');
        const currentMeta = document.getElementById('currentMeta');
        const playlistEl = document.getElementById('playlistContainer');

        let currentIndex = 0;          // 当前播放视频的索引
        let isUserClick = false;       // 防止切换时自动播放冲突

        // ------------------------------------------------------------
        // 3. 核心函数：加载视频
        // ------------------------------------------------------------
        function loadVideo(index) {
            if (index < 0 || index >= videoData.length) return;

            const item = videoData[index];
            // 构建视频文件路径 —— 假设所有视频与 index.html 在同一目录
            const filePath = `${item.name}.mp4`;

            // 更新视频源
            source.src = filePath;
            video.load();

            // 更新 UI 信息
            currentTitle.textContent = `🎬 ${item.name}`;
            currentMeta.textContent = `${item.duration} · ${item.size}`;

            // 更新列表高亮
            const allItems = playlistEl.querySelectorAll('.playlist-item');
            allItems.forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            // 自动播放（如果用户没有主动暂停，保持体验连贯）
            // 但由于 load() 后需要等 canplay，用 setTimeout 确保播放
            setTimeout(() => {
                video.play().catch(() => {
                    // 自动播放被浏览器阻止时静默处理
                });
            }, 100);

            currentIndex = index;
        }

        // ------------------------------------------------------------
        // 4. 生成播放列表
        // ------------------------------------------------------------
        function renderPlaylist() {
            playlistEl.innerHTML = '';
            videoData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'playlist-item';
                div.setAttribute('role', 'listitem');
                div.dataset.index = index;

                // 文件名 + 小标签
                const nameSpan = document.createElement('span');
                nameSpan.className = 'file-name';
                nameSpan.innerHTML = `
                    ${item.name}
                    <span class="badge">MP4</span>
                `;

                // 时长 + 大小
                const metaSpan = document.createElement('span');
                metaSpan.className = 'file-meta';
                metaSpan.textContent = `${item.duration} · ${item.size}`;

                div.appendChild(nameSpan);
                div.appendChild(metaSpan);

                // 点击切换
                div.addEventListener('click', function(e) {
                    const idx = parseInt(this.dataset.index, 10);
                    if (idx !== currentIndex) {
                        loadVideo(idx);
                    } else {
                        // 如果点击的是同一个，重新播放
                        video.currentTime = 0;
                        video.play().catch(() => {});
                    }
                });

                playlistEl.appendChild(div);
            });

            // 默认选中第一个
            if (videoData.length > 0) {
                loadVideo(0);
            } else {
                currentTitle.textContent = '⚠️ 没有视频';
                playlistEl.innerHTML = '<div class="empty-state">暂无视频文件</div>';
            }
        }

        // ------------------------------------------------------------
        // 5. 键盘事件：上下键切换
        // ------------------------------------------------------------
        function handleKeydown(e) {
            // 防止与输入框等冲突
            const tag = e.target.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

            const key = e.key;
            if (key === 'ArrowUp') {
                e.preventDefault();
                const newIndex = Math.max(0, currentIndex - 1);
                if (newIndex !== currentIndex) loadVideo(newIndex);
            } else if (key === 'ArrowDown') {
                e.preventDefault();
                const newIndex = Math.min(videoData.length - 1, currentIndex + 1);
                if (newIndex !== currentIndex) loadVideo(newIndex);
            }
        }

        // ------------------------------------------------------------
        // 6. 初始化
        // ------------------------------------------------------------
        renderPlaylist();
        window.addEventListener('keydown', handleKeydown);

        // 如果视频加载失败（例如文件不存在），给出提示
        video.addEventListener('error', function() {
            const fileName = videoData[currentIndex]?.name || '未知';
            console.warn(`视频加载失败: ${fileName}.mp4`);
            // 显示友好提示
            currentTitle.textContent = `❌ 加载失败: ${fileName}`;
            currentMeta.textContent = '请检查文件是否存在';
        });

        // 当视频可以播放时，更新一下状态（可选）
        video.addEventListener('canplay', function() {
            // 如果之前有错误提示，清除
            if (currentTitle.textContent.includes('加载失败')) {
                const item = videoData[currentIndex];
                if (item) {
                    currentTitle.textContent = `🎬 ${item.name}`;
                    currentMeta.textContent = `${item.duration} · ${item.size}`;
                }
            }
        });

        // 清理事件（虽然不是必须，但作为好习惯）
        window.addEventListener('beforeunload', function() {
            window.removeEventListener('keydown', handleKeydown);
        });

        console.log(`✅ 播放器已启动，共 ${videoData.length} 个视频`);
    })();
</script>
</body>
</html>
